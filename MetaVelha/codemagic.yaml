workflows:
  meta-velha-ios:
    name: Meta Velha iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.metavelha.game
    scripts:
      - name: Instalar dependências JavaScript
        script: npm install
      - name: Preparar projeto iOS
        script: |
          npm run build
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Configurar assinatura Apple
        script: xcode-project use-profiles
      - name: Gerar IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
